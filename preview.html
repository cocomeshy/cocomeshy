<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cocomeshy · preview</title>
  <style>
    :root { --bg: #ffffff; --border: #d1d9e0; --muted: #59636e; --btn: #f6f8fa; --ink: #1f2328; }
    html[data-theme="dark"] { --bg: #0d1117; --border: #30363d; --muted: #8b949e; --btn: #21262d; --ink: #e6edf3; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 20px 80px; background: var(--bg); color: var(--ink);
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { max-width: 1012px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    button { cursor: pointer; border: 1px solid var(--border); background: var(--btn); color: var(--ink); border-radius: 6px; padding: 5px 12px; font: inherit; }
    .box { max-width: 1012px; margin: 0 auto; border: 1px solid var(--border); border-radius: 6px; padding: 32px; }
    .label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin: -16px 0 24px; }
    .box img { display: block; max-width: 100%; }
    .box picture img, .box > a > img { width: 100%; height: auto; margin-bottom: 4px; }
    .links { display: flex; gap: 6px; margin-top: 28px; }
    .links img { height: 40px; width: auto; }
  </style>
</head>
<body>
  <div class="bar">
    <span>local preview · mimics github's readme box at desktop width</span>
    <button id="t">dark mode</button>
  </div>
  <div class="box">
    <div class="label">cocomeshy / README.md</div>
    <img data-n="hero" alt="" />
    <img data-n="stats" alt="" />
    <img data-n="about" alt="" />
    <a href="https://www.last.fm/user/cocomeshy"><img data-n="music" alt="" /></a>
    <div class="links">
      <a href="https://discord.com/users/1433331742852255919"><img data-n="link-discord" alt="" /></a>
      <a href="https://t.me/cocomeshy"><img data-n="link-telegram" alt="" /></a>
      <a href="https://www.last.fm/user/cocomeshy"><img data-n="link-lastfm" alt="" /></a>
    </div>
  </div>
  <script>
    const btn = document.getElementById("t");
    const set = (m) => {
      document.documentElement.dataset.theme = m;
      btn.textContent = m === "dark" ? "light mode" : "dark mode";
      document.querySelectorAll("[data-n]").forEach((el) => {
        el.src = `./assets/${el.dataset.n}-${m}.svg?v=${Date.now()}`;
        el.style.width = el.dataset.n.startsWith("link-") ? "auto" : "100%";
      });
    };
    btn.onclick = () => set(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    set(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</body>
</html>
